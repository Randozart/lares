// People and occasions: the memory layer behind proactive household help.
//
// A Person is someone the household cares about; an Occasion is a dated event
// (birthday, anniversary, custom) that drives lead-time nudges like gifts,
// cake, and cards. Dates are strings: "MM-DD" for yearly recurrences,
// "YYYY-MM-DD" for one-time events.
syntax = "proto3";

package lares.v1;

option java_package = "dev.randozart.lares.proto";
option java_multiple_files = true;
option java_outer_classname = "PeopleProto";

// The kind of a dated occasion.
enum OccasionKind {
  OCCASION_KIND_UNSPECIFIED = 0;
  OCCASION_KIND_BIRTHDAY = 1;
  OCCASION_KIND_ANNIVERSARY = 2;
  OCCASION_KIND_CUSTOM = 3;
}

// Someone the household cares about.
message Person {
  // Stable identifier, generated by the server.
  string id = 1;
  string name = 2;
  // Preferences, sizes, allergies, gift ideas.
  string notes = 3;
}

// A dated occasion that can recur yearly.
message Occasion {
  // Stable identifier, generated by the server.
  string id = 1;
  // Optional link to a person.
  string person_id = 2;
  string title = 3;
  // "MM-DD" (yearly) or "YYYY-MM-DD" (one-time).
  string date = 4;
  OccasionKind kind = 5;
  string notes = 6;
}

// What kind of thing the briefing item asks for.
enum BriefingItemKind {
  BRIEFING_ITEM_KIND_UNSPECIFIED = 0;
  // A dated occasion is approaching.
  BRIEFING_ITEM_KIND_OCCASION = 1;
  // A manual task is due.
  BRIEFING_ITEM_KIND_TASK = 2;
}

// Lead-time action flags computed for approaching occasions.
enum LeadFlag {
  LEAD_FLAG_UNSPECIFIED = 0;
  // Order/buy the gift (14 days out).
  LEAD_FLAG_GIFT = 1;
  // Order the cake (2 days out).
  LEAD_FLAG_CAKE = 2;
  // Get the card (1 day out).
  LEAD_FLAG_CARD = 3;
  // Put up decorations (7 days out).
  LEAD_FLAG_DECOR = 4;
  // Clean for the event (1 day out).
  LEAD_FLAG_CLEANING = 5;
}

// One dated thing that needs attention soon.
message BriefingItem {
  string title = 1;
  // Days from today until the event; 0 = today.
  int32 days_until = 2;
  // The concrete date, YYYY-MM-DD.
  string due_date = 3;
  BriefingItemKind kind = 4;
  repeated LeadFlag flags = 5;
}

// The proactive digest: everything dated within the horizon.
message Briefing {
  repeated BriefingItem items = 1;
}

message PersonList {
  repeated Person people = 1;
}

message OccasionList {
  repeated Occasion occasions = 1;
}

// Import occasions from an ICS calendar URL (e.g. Google Calendar secret
// iCal address).
message ImportCalendarRequest {
  string url = 1;
}

message ImportCalendarResponse {
  // Occasions created or refreshed by the import.
  uint32 imported = 1;
  // People known after the import.
  uint32 people = 2;
}

// What kind of event preparation this is.
enum PreparationKind {
  PREPARATION_KIND_UNSPECIFIED = 0;
  PREPARATION_KIND_GIFT = 1;
  PREPARATION_KIND_CAKE = 2;
  PREPARATION_KIND_CARD = 3;
  PREPARATION_KIND_DECOR = 4;
  PREPARATION_KIND_CLEANING = 5;
  PREPARATION_KIND_CUSTOM = 6;
}

// Lifecycle of a preparation for an important event.
enum PreparationState {
  PREPARATION_STATE_UNSPECIFIED = 0;
  PREPARATION_STATE_IDEA = 1;
  // Bought, made, or arranged — nothing left to prepare.
  PREPARATION_STATE_READY = 2;
  // Given, used, or otherwise resolved.
  PREPARATION_STATE_DONE = 3;
}

// A preparation tracked toward an important event (birthday, anniversary,
// party). May link to a person ("gift for Emma"), an occasion, or both.
message Preparation {
  // Stable identifier, generated by the server.
  string id = 1;
  // Optional owning person.
  string person_id = 2;
  // Optional occasion this preparation belongs to.
  string occasion_id = 3;
  string title = 4;
  PreparationKind kind = 5;
  PreparationState state = 6;
}

message PreparationList {
  repeated Preparation preparations = 1;
}
