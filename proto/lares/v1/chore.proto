// Lares core domain contract.
//
// A ChoreEntity is an affordance attached to an object in a room, not merely a
// bounding box. Optional scheduling fields exist so that Phase G (proactive
// nudging) needs no schema migration.
syntax = "proto3";

package lares.v1;

option java_package = "dev.randozart.lares.proto";
option java_multiple_files = true;
option java_outer_classname = "ChoreProto";

// Normalized bounding box. Coordinates are integers in the range 0..=1000,
// expressed as [ymin, xmin, ymax, xmax] to match Gemini's native box_2d order.
message BoundingBox {
  int32 ymin = 1;
  int32 xmin = 2;
  int32 ymax = 3;
  int32 xmax = 4;
}

// Lifecycle of a chore. Discovered chores are surfaced; DONE/DISMISSED retire.
enum ChoreStatus {
  CHORE_STATUS_UNSPECIFIED = 0;
  CHORE_STATUS_DISCOVERED = 1;
  CHORE_STATUS_IN_PROGRESS = 2;
  CHORE_STATUS_DONE = 3;
  CHORE_STATUS_DISMISSED = 4;
}

// Where a chore came from and how it is handled. VISION chores carry boxes
// and are tracked on the overlay; TASK/REMINDER chores are manual entries
// with due dates.
enum ChoreKind {
  CHORE_KIND_UNSPECIFIED = 0;
  CHORE_KIND_VISION = 1;
  CHORE_KIND_TASK = 2;
  CHORE_KIND_REMINDER = 3;
}

// Typed room area so the model can reason about whether objects are expected.
enum RoomArea {
  ROOM_AREA_UNSPECIFIED = 0;
  ROOM_AREA_KITCHEN = 1;
  ROOM_AREA_BATHROOM = 2;
  ROOM_AREA_BEDROOM = 3;
  ROOM_AREA_LIVING_ROOM = 4;
  ROOM_AREA_DINING_ROOM = 5;
  ROOM_AREA_OFFICE = 6;
  ROOM_AREA_GARAGE = 7;
  ROOM_AREA_LAUNDRY = 8;
  ROOM_AREA_HALLWAY = 9;
  ROOM_AREA_KIDS_ROOM = 10;
  ROOM_AREA_PATIO = 11;
  ROOM_AREA_OTHER = 99;
}

// A single actionable chore discovered in a room.
message ChoreEntity {
  // Stable identifier, generated by the server if the engine omits one.
  string id = 1;
  // Room the chore belongs to, e.g. "kitchen".
  string room_id = 2;
  // The object or mess the chore concerns, e.g. "scattered socks".
  string target = 3;
  // Direct atomic imperative, e.g. "Put socks in laundry hamper".
  string action = 4;
  // Expected time to complete, in seconds.
  uint32 estimated_seconds = 5;
  // Current lifecycle state.
  ChoreStatus status = 6;
  // Where the chore was seen.
  BoundingBox box = 7;
  // Model confidence in the range 0.0..=1.0.
  float confidence = 8;
  // Atomic single-step actions derived from the action. Never empty after
  // post-processing.
  repeated string subtasks = 9;

  // --- Phase G scheduling fields. Unused by the MVP, no migration needed. ---
  // Relative priority; higher means surface sooner.
  optional uint32 priority = 10;
  // Unix seconds at which the chore should be surfaced.
  optional int64 due_at_unix = 11;
  // Unix seconds before which the chore must not be surfaced again.
  optional int64 cooldown_until_unix = 12;
  // Unix seconds the chore was last observed.
  optional int64 last_seen_unix = 13;
  // Free-form context tags, e.g. "quick_win", "needs_standing".
  repeated string context_tags = 14;
  // Subjective effort cost in the range 0.0..=1.0.
  optional float energy_cost = 15;
  // Concrete, judgment-free physical steps for doing the chore. Never empty
  // after post-processing. Example for "put away": "1. Pick up the mug.
  // 2. Walk to the cupboard. 3. Put it on the middle shelf."
  repeated string how_to = 16;
  // Frame index (0-based) the chore was detected in, for sweep captures.
  int32 image_index = 17;
  // Typed room area the chore was detected in.
  RoomArea room_area = 18;
  // 1-based index identifying this specific physical object in the scene.
  // Stable across the scene — same object always gets the same number.
  int32 object_index = 19;
  // Origin of the chore: vision-detected or manually added.
  ChoreKind kind = 20;
}

// A persistent, named spatial anchor in a room (e.g. sink basin, hamper).
// Returned in DISCOVER mode so the client can remember where things live.
message Landmark {
  // Human label, e.g. "sink basin" or "laundry hamper".
  string label = 1;
  // Normalized location of the landmark in the frame.
  BoundingBox box = 2;
}

// The agreed target state ("definition of done") for a room.
message ReferenceState {
  string room_id = 1;
  // Identifier of the stored reference image.
  string image_id = 2;
  // Human description of the agreed state.
  string description = 3;
  // Unix seconds the reference was captured.
  int64 captured_at_unix = 4;
}
