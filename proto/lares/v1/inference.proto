// Inference contract: the slow-loop request/response between the client and the
// Rust core.
syntax = "proto3";

package lares.v1;

option java_package = "dev.randozart.lares.proto";
option java_multiple_files = true;
option java_outer_classname = "InferenceProto";

import "lares/v1/chore.proto";

// How a frame should be analyzed.
enum AnalyzeMode {
  ANALYZE_MODE_UNSPECIFIED = 0;
  // Find all actionable chores in the frame.
  ANALYZE_MODE_DISCOVER = 1;
  // Compare the frame against the room's reference state; emit only deltas.
  ANALYZE_MODE_DIFF = 2;
}

// A request to analyze one captured keyframe.
message AnalyzeSceneRequest {
  string room_id = 1;
  // JPEG bytes of the captured frame.
  bytes frame_jpeg = 2;
  // Optional agreed target state. Required for ANALYZE_MODE_DIFF.
  optional bytes reference_jpeg = 3;
  AnalyzeMode mode = 4;
  // Consecutive frames of a pan. When set, the request is a sweep: the model
  // reports each chore once, in the frame where it is clearest, and each
  // returned chore carries its image_index.
  repeated bytes sweep_jpegs = 5;
  // Typed room area so the model can reason about object expectations.
  RoomArea room_area = 6;
  // Which client produced the frame. Enables source-specific policies
  // (rate limits, reminder matching) later.
  AnalyzeSource source = 7;
}

// Origin of an analyze request.
enum AnalyzeSource {
  ANALYZE_SOURCE_UNSPECIFIED = 0;
  ANALYZE_SOURCE_PHONE = 1;
  ANALYZE_SOURCE_CAMERA_NODE = 2;
}

// Ask which stored room reference a frame matches best.
message InferRoomRequest {
  bytes frame_jpeg = 1;
  // Landmark labels from the current scan; when >= 2 are present the server
  // infers the room by matching stored landmark profiles (no VLM call).
  repeated string landmarks = 2;
}

message InferRoomResponse {
  string room_id = 1;
  float confidence = 2;
  // Landmarks that matched the winning room (empty for vision inference).
  repeated string evidence = 3;
}

// A frozen-loop observation that satisfies an open chore's directive.
message CompletionCandidate {
  string chore_id = 1;
  // The chore's action text, for the chip label.
  string action = 2;
}

// A fast ambient tick: frozen models only, no VLM.
message TickRequest {
  string room_id = 1;
  bytes frame_jpeg = 2;
  RoomArea room_area = 3;
}

message TickResponse {
  string room_id = 1;
  // Zero-shot room class from CLIP, when the sidecar is configured.
  string scene_class = 2;
  // Misplaced-object candidates in ChoreEntity shape, ephemeral.
  repeated ChoreEntity candidates = 3;
  // Open chores whose expected relation was observed — completion chips.
  repeated CompletionCandidate completions = 4;
  // True when the tick saw an object class unseen in this room; the client
  // should schedule a deep VLM audit.
  bool audit_recommended = 5;
}

// The result of analyzing a frame.
message AnalyzeSceneResponse {
  repeated ChoreEntity chores = 1;
  // Identifier of the engine/model that produced the result.
  string model = 2;
  // Wall-clock inference latency in milliseconds.
  uint32 latency_ms = 3;
  // Named spatial anchors discovered in the frame (DISCOVER mode only).
  repeated Landmark landmarks = 4;
  // Zero-shot room class from the frozen-vision sidecar (CLIP), if configured.
  string scene_class = 5;
}

// A request to store a room's agreed target state.
message SetReferenceRequest {
  string room_id = 1;
  // Human description of the agreed state.
  string description = 2;
  // JPEG bytes of the reference image.
  bytes frame_jpeg = 3;
}

// A request to transition a chore's lifecycle state.
message SetChoreStatusRequest {
  string chore_id = 1;
  ChoreStatus status = 2;
}

// A list of chores.
message ListChoresResponse {
  repeated ChoreEntity chores = 1;
}

// A room's current named spatial anchors.
message LandmarkList {
  repeated Landmark landmarks = 1;
}

// Role of a stored scene fingerprint.
enum FingerprintKind {
  FINGERPRINT_KIND_UNSPECIFIED = 0;
  FINGERPRINT_KIND_LATEST = 1;
  FINGERPRINT_KIND_HISTORY = 2;
  FINGERPRINT_KIND_CLEAN = 3;
}

// A request to store a room's scene fingerprint.
message SetFingerprintRequest {
  FingerprintKind kind = 1;
  // Packed grid-edge-hash produced by the client tracker (opaque).
  bytes grid_hash = 2;
}

// A stored scene fingerprint.
message FingerprintRecord {
  string room_id = 1;
  FingerprintKind kind = 2;
  bytes grid_hash = 3;
  int64 captured_at_unix = 4;
}

// A list of stored fingerprints.
message ListFingerprintsResponse {
  repeated FingerprintRecord fingerprints = 1;
}
